</style></head><body><header><div class="header-title"><h1>📺 終極系列 24H 輪播時刻表</h1></div><div class="header-actions"><span id="adminStatus" aria-live="polite">正在連接雲端設定…</span><button class="btn" id="loginBtn" type="button" onclick="loginAdmin()">登入</button><button class="btn" id="adminModeBtn" type="button" onclick="enterManagement()">管理模式</button><button class="btn" id="exitModeBtn" type="button" onclick="exitManagement()">退出管理模式</button><button class="btn" id="logoutBtn" type="button" onclick="logoutAdmin()">登出</button><button class="btn primary" id="publishBtn" type="button" onclick="publishSchedule()">發布設定給所有觀眾</button><span id="lastPublished" class="last-published" aria-live="polite">最後更新：尚未發布</span></div></header><main>

<section class="panel"><h2>⚙️ 輪播設定</h2><div class="settings"><div><label>輪播起始時間（台灣時間）</label><input type="datetime-local" step="1" id="start" onchange="updateStart()"><p class="muted">從此時刻的第 1 部第 1 集開始，24 小時連續循環。</p></div><div id="selectArea"><label>本輪播放片單（依實際播放順序）</label><div id="dramas"></div><p class="muted">可上下調整順序，取消勾選即略過該劇。</p></div></div></section>
<section class="panel"><h2>🎯 依直播進度校正</h2><div class="settings"><div><label>目前第幾輪</label><input type="number" min="1" step="1" id="anchorRound" value="1" onchange="applyAnchor()"></div><div><label>指定播放時間（台灣時間）</label><input type="datetime-local" step="1" id="anchorTime" onchange="applyAnchor()"></div><div><label>當時播放的劇</label><select id="anchorDrama" onchange="fillAnchorEpisodes();applyAnchor()"></select></div><div><label>播放集數</label><select id="anchorEpisode" onchange="applyAnchor()"></select></div></div><div class="flex" style="margin-top:14px"><button class="btn primary" id="adminApply" onclick="applyAnchor()">套用進度，重新計算</button><button class="btn" id="adminNow" onclick="setAnchorNow()">指定時間填入現在</button></div><p id="anchorMessage" class="muted"></p></section><section class="panel"><div class="stats"><div class="stat">本輪總集數<strong id="count">—</strong></div><div class="stat">本輪總時長<strong id="duration">—</strong></div><div class="stat">目前第幾輪<strong id="round">—</strong></div><div class="stat">下一輪開始<strong id="next">—</strong></div></div><h2>🔴 目前播放</h2><div id="now" class="playing"></div></section>
<section class="panel"><div class="flex between"><h2>🗓️ 播出時刻表</h2><div class="tabs flex"><button id="viewDrama" onclick="switchView('drama')">劇集總覽</button><button id="viewEpisode" onclick="switchView('episode')">每集詳細</button></div></div><div class="flex"><div><label>查詢日期（當日模式）</label><input type="date" id="date" onchange="render()"></div><div><label>顯示範圍</label><select id="scope" onchange="render()"><option value="forward">從校正集數開始（三國六輪／全系列三輪）</option><option value="round">指定第幾輪（完整一輪）</option><option value="cycle">查詢日期所在輪次（完整一輪）</option><option value="day">當日 00:00～24:00</option></select></div><div style="align-self:end"><button class="btn primary" onclick="exportCSV()">下載目前時刻表 CSV</button></div></div><div class="scroll schedule-scroll"><table><thead id="head"></thead><tbody id="rows"></tbody></table></div><p id="resultCount" class="muted"></p></section><section class="un-footer" id="unFooter">
<section class="un-box admin-edit"><h2>✏️ 編輯劇集資料</h2><p class="un-note">可修改每集片長（秒）與 YouTube 影片網址，調整後會重新計算輪播時間。記得發布給觀眾。</p><div class="un-editor"><select id="unDrama" onchange="unFillEpisodes()"></select><select id="unEpisode"></select><input id="unSeconds" type="number" min="1" placeholder="片長（秒）"><input id="unVideo" type="url" placeholder="YouTube 影片網址"></div><div class="un-buttons"><button class="un-btn" onclick="unLoadEpisode()">讀取該集</button><button class="un-btn primary" onclick="unSaveEpisode()">儲存這集</button></div></section><section class="un-box"><h2>🔗 終極系列相關網站</h2><div class="un-grid" id="unRelated"></div><div class="un-buttons admin-edit"><button class="un-btn" onclick="unAdd('related')">＋ 新增相關網站</button></div></section>
<section class="un-box"><h2>▶️ 終極系列播放清單</h2><div class="un-grid" id="unPlaylists"></div><div class="un-buttons admin-edit"><button class="un-btn" onclick="unAdd('playlists')">＋ 新增播放清單</button></div></section>
<section class="un-box"><h2>📚 資料來源</h2><div class="un-grid" id="unSources"></div><div class="un-buttons admin-edit"><button class="un-btn" onclick="unAdd('sources')">＋ 新增資料來源</button></div></section>
<div class="un-export-actions"><div class="un-buttons"><button class="un-btn" onclick="exportCSV()">匯出 Excel 表格（CSV）</button><button class="un-btn" onclick="unBackup()">匯出備份 JSON</button><button class="un-btn" onclick="openBackupImport()">匯入備份 JSON</button><input type="file" id="unImport" accept=".json,application/json" hidden onchange="unRestore(event)"></div></div>
</section></main>
